# nfpm config for the linux/amd64 .deb and .rpm packages built by
# .github/workflows/release.yml. See https://nfpm.goreleaser.com/configuration/
name: bugrep
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Ricardo Branco <rbranco@suse.de>
vendor: ricardobranco777
homepage: https://github.com/ricardobranco777/bugrep
description: |
  Search Bugzilla, Jira, Redmine, GitHub, GitLab, Gitea/Forgejo and
  Launchpad issues from one CLI.
# license: set once a license is chosen for the project.

contents:
  - src: ./bugrep
    dst: /usr/bin/bugrep
  - src: ./README.md
    dst: /usr/share/doc/bugrep/README.md
